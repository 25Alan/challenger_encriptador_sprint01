<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Encriptador y desencriptador de textos - Challenge Oracle ONE / Alura">

    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Telugu:wght@700&display=swap" rel="stylesheet">

    <title>Encriptador</title>
</head>

<body>
    <header>
        <h1>ENCRIPTADOR</h1>
    </header>

    <main>
        <section id="input">
            <label for="inputText" class="visually-hidden">Texto a encriptar o desencriptar</label>
            <textarea name="inputText" id="inputText" rows="8"
                placeholder="INGRESAR TEXTO SIN ACENTOS Y EN MINÚSCULAS"></textarea>

            <div class="botones">
                <button type="button" class="button" id="buttonEncriptar">ENCRIPTAR</button>
                <button type="button" class="button" id="buttonDesencriptar">DESENCRIPTAR</button>
            </div>

            <p id="mensaje" role="status" aria-live="polite"></p>
        </section>

        <section id="image">
            <img src="./image/muneco.svg" alt="" width="336" height="304">
        </section>

        <section id="output">
            <label for="outputText" class="visually-hidden">Resultado</label>
            <textarea name="outputText" id="outputText" rows="8" readonly
                placeholder="EL RESULTADO APARECERÁ AQUÍ"></textarea>

            <button type="button" class="button" id="buttonCopy">COPIAR</button>
        </section>
    </main>

    <footer>
        &copy; Romero Alan - GitHub: <a href="https://github.com/25Alan" target="_blank" rel="noopener">25Alan</a>
    </footer>

    <script src="./js/script.js" type="module"></script>
</body>

</html>
